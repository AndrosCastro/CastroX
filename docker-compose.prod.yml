# CastroX · Producción en un servidor VPS
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere en .env: DOMAIN, DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD
name: castrox

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: castrox-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1024}
    # Sin puertos publicados: la base de datos solo es accesible desde la app
    volumes:
      - castrox-sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: always

  app:
    build: .
    image: castrox-app:latest
    container_name: castrox-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      ENABLE_HTTPS: "false"
      DB_HOST: db
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-CastroX}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-false}
    expose:
      - "3000"
    restart: always

  caddy:
    image: caddy:2.8.4-alpine
    container_name: castrox-caddy
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  castrox-sqldata:
  caddy-data:
  caddy-config:
