# CastroX · Producción en un servidor VPS
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere en .env: DOMAIN, DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD
name: castrox

services:
  db:
    image: postgres:16-alpine
    container_name: castrox-db
    environment:
      POSTGRES_USER: castrox
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-castrox}
    # Sin puertos publicados: la base de datos solo es accesible desde la app
    volumes:
      - castrox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castrox -d ${DB_NAME:-castrox}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  app:
    build: .
    image: castrox-app:latest
    container_name: castrox-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      ENABLE_HTTPS: "false"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: castrox
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-castrox}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-false}
    expose:
      - "3000"
    restart: always

  caddy:
    image: caddy:2.8.4-alpine
    container_name: castrox-caddy
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  castrox-pgdata:
  caddy-data:
  caddy-config:
