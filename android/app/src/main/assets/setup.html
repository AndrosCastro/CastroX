<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Conectar CastroX</title>
  <style>
    :root { --brand:#4f46e5; --brand2:#06b6d4; --bg:#f4f6fb; --surface:#fff; --text:#0f172a; --muted:#64748b; --border:#e5e7eb; --danger:#dc2626; --danger-soft:#fee2e2; --ok:#059669; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --surface:#111827; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2937; --danger:#f87171; --danger-soft:rgba(248,113,113,.14); --ok:#34d399; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .hero { background: linear-gradient(135deg,#312e81,#4f46e5 45%,#06b6d4); color:#fff; padding: 36px 22px 64px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:22px; }
    .brand svg { width:40px; height:40px; }
    .hero h1 { font-size: 26px; margin: 22px 0 6px; }
    .hero p { margin:0; opacity:.9; }
    .card { background: var(--surface); border:1px solid var(--border); border-radius: 18px; margin: -40px 16px 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:14px; }
    label { font-weight: 600; font-size: 14px; }
    input { width:100%; padding: 14px; font-size: 16px; border-radius: 12px; border:1px solid var(--border); background: var(--surface); color: var(--text); font-family: ui-monospace, monospace; }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    button { width:100%; border:0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
    .primary { background: var(--brand); color:#fff; }
    .secondary { background: transparent; color: var(--text); border:1px solid var(--border); }
    button:disabled { opacity:.6; }
    .error { background: var(--danger-soft); color: var(--danger); padding: 12px; border-radius: 12px; font-size: 14px; display:none; }
    .muted { color: var(--muted); font-size: 13px; margin:0; }
    .or { text-align:center; color: var(--muted); font-size: 13px; }
    #reader { width:100%; border-radius: 14px; overflow:hidden; background:#000; display:none; }
    #reader video { width:100% !important; }
    .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps { margin: 0 16px 30px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="rgba(255,255,255,.18)"/><g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22v-6a2 2 0 0 1 2-2h6M42 14h6a2 2 0 0 1 2 2v6M50 42v6a2 2 0 0 1-2 2h-6M22 50h-6a2 2 0 0 1-2-2v-6"/><path d="M24 24l16 16M40 24L24 40"/></g></svg>
      CastroX
    </div>
    <h1>Conectar con tu inventario</h1>
    <p>Escribe o escanea la dirección del servidor de CastroX.</p>
  </div>

  <form class="card" id="form" novalidate>
    <div class="error" id="error"></div>
    <div>
      <label for="url">Dirección del servidor</label>
      <input id="url" type="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://mi-inventario.com" />
    </div>
    <button class="primary" type="submit" id="connect">Conectar</button>
    <div class="or">o bien</div>
    <button class="secondary" type="button" id="scan">📷 Escanear código QR de conexión</button>
    <div id="reader"></div>
    <p class="muted">El código QR de conexión aparece en CastroX → <b>Ajustes</b> → <b>App Android</b>, en cualquier computadora que ya tenga la app abierta.</p>
  </form>

  <div class="steps" id="version"></div>

  <script src="html5-qrcode.min.js"></script>
  <script>
    const app = window.CastroXApp;
    const params = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    const input = $('url'), errBox = $('error'), connectBtn = $('connect'), scanBtn = $('scan'), reader = $('reader');
    let scanner = null;

    input.value = params.get('url') || (app ? app.getServer() : '') || '';
    if (params.get('error')) showError(params.get('error'));
    if (app) $('version').textContent = 'Versión de la app: ' + app.getVersion();

    function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }

    function normalize(v) {
      v = (v || '').trim();
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
      try { const u = new URL(v); return u.origin; } catch (e) { return null; }
    }

    async function connect(raw) {
      errBox.style.display = 'none';
      const url = normalize(raw);
      if (!url) { showError('Escribe una dirección válida, por ejemplo https://mi-inventario.com'); return; }
      connectBtn.disabled = true;
      connectBtn.innerHTML = '<span class="spinner"></span> Conectando…';
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        const res = await fetch(url + '/api/health', { cache: 'no-store', signal: ctrl.signal });
        const data = await res.json();
        if (data.app !== 'CastroX') throw new Error('not-castrox');
        if (!app || !app.setServer(url)) throw new Error('invalid');
      } catch (e) {
        showError(e.message === 'not-castrox'
          ? 'Esa dirección no es un servidor de CastroX.'
          : 'No se pudo conectar con ' + url + '. Revisa la dirección y tu conexión a internet.');
      } finally {
        clearTimeout(timer);
        connectBtn.disabled = false;
        connectBtn.textContent = 'Conectar';
      }
    }

    $('form').addEventListener('submit', (e) => { e.preventDefault(); connect(input.value); });

    async function stopScan() {
      if (scanner) { try { await scanner.stop(); } catch (e) {} try { scanner.clear(); } catch (e) {} }
      scanner = null;
      reader.style.display = 'none';
      scanBtn.textContent = '📷 Escanear código QR de conexión';
    }

    scanBtn.addEventListener('click', async () => {
      if (scanner) { stopScan(); return; }
      if (!window.Html5Qrcode) { showError('El lector de QR no está disponible.'); return; }
      errBox.style.display = 'none';
      reader.style.display = 'block';
      scanBtn.textContent = 'Cancelar escaneo';
      scanner = new Html5Qrcode('reader', { verbose: false });
      try {
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 230 }, async (text) => {
          await stopScan();
          input.value = text;
          connect(text);
        }, () => {});
      } catch (e) {
        stopScan();
        showError('No se pudo abrir la cámara. Revisa que CastroX tenga permiso de cámara.');
      }
    });
  </script>
</body>
</html>
