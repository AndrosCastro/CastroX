# CastroX · Respaldo diario de la base de datos (Neon)
# Guarda un respaldo completo y comprimido en la rama "respaldos" de este repositorio.
# Requiere el secreto DATABASE_URL (Settings → Secrets and variables → Actions).
name: Respaldo de la base de datos

on:
  schedule:
    - cron: '0 8 * * *' # todos los días a las 08:00 UTC = 2:00 am en Honduras
  workflow_dispatch: # botón "Run workflow" para hacer un respaldo en cualquier momento

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

defaults:
  run:
    shell: bash # con pipefail: si pg_dump falla, el respaldo falla

env:
  RAMA: respaldos
  CONSERVAR: 60 # cuántos respaldos diarios se guardan

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar configuración
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL en Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar la rama de respaldos
        run: |
          git config user.name "CastroX respaldo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$RAMA" >/dev/null; then
            git checkout -q "$RAMA"
          else
            # Primera vez: rama vacía, separada del código
            git checkout -q --orphan "$RAMA"
            git rm -rfq .
            # Evita que Vercel intente publicar esta rama
            printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
            cat > README.md <<'EOF'
          # Respaldos de CastroX

          Respaldos diarios automáticos de la base de datos (carpeta `respaldos/`), creados por
          `.github/workflows/respaldo.yml` en la rama `main`.

          Restaurar un respaldo en una base PostgreSQL vacía:

          ```bash
          gunzip -c respaldos/castrox-AAAA-MM-DD.sql.gz | psql "postgres://usuario:clave@servidor/base"
          ```
          EOF
          fi
          mkdir -p respaldos

      - name: Respaldar la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FILE="respaldos/castrox-$(TZ=America/Tegucigalpa date +%Y-%m-%d).sql.gz"
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-privileges --clean --if-exists' \
            | sed '/^SET transaction_timeout/d' \
            | gzip -9 > "$FILE"
          # Comprobar que el respaldo tiene las tablas de la app
          for t in users categories products movements; do
            gunzip -c "$FILE" | grep -qi "CREATE TABLE public.$t " || { echo "::error::El respaldo no contiene la tabla $t"; exit 1; }
          done
          echo "Respaldo creado: $FILE ($(du -h "$FILE" | cut -f1))"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Guardar en GitHub
        run: |
          # Conservar solo los últimos $CONSERVAR respaldos
          ls -1 respaldos/castrox-*.sql.gz | sort | head -n -"$CONSERVAR" | xargs -r git rm -q --
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios desde el último respaldo"
          else
            git commit -qm "Respaldo $(TZ=America/Tegucigalpa date '+%Y-%m-%d %H:%M')"
            git push -q origin "$RAMA"
          fi
