name: castrox

services:
  db:
    image: postgres:16-alpine
    container_name: castrox-db
    environment:
      POSTGRES_USER: castrox
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-castrox}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - castrox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castrox -d ${DB_NAME:-castrox}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: castrox-app:latest
    container_name: castrox-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      HTTPS_PORT: 3443
      ENABLE_HTTPS: ${ENABLE_HTTPS:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: castrox
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-castrox}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO: ${SEED_DEMO:-true}
      CERT_DIR: /app/certs
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${APP_HTTPS_PORT:-3443}:3443"
    volumes:
      - castrox-certs:/app/certs
      # El frontend se monta desde la carpeta local: los cambios se ven al recargar el navegador
      - ./frontend:/app/public:ro
    restart: unless-stopped

  # Acceso público desde internet con Cloudflare Tunnel (gratis, HTTPS válido).
  # Iniciar con:  docker compose --profile tunnel up -d
  # Ver la dirección pública:  docker compose logs tunnel  (busca https://....trycloudflare.com)
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: castrox-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    restart: unless-stopped

volumes:
  castrox-pgdata:
  castrox-certs:
